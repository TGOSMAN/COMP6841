<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Situation | Signal Forge CTF</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="challenge-page">
    <header class="challenge-topbar context-topbar">
      <div class="challenge-nav-links">
        <a class="back-link" href="/#tasks">&larr; All situations</a>
        <a href="/guide.html">Setup Guide</a>
      </div>
      <div class="challenge-progress" id="context-progress" aria-label="Situation status"></div>
    </header>

    <main class="challenge-shell context-shell">
      <section class="challenge-brief context-brief" aria-labelledby="context-title">
        <div class="challenge-heading">
          <div>
            <p class="eyebrow" id="context-kicker">Situation</p>
            <h1 id="context-title">Loading situation...</h1>
          </div>
          <div class="challenge-score" id="context-score"></div>
        </div>
        <p class="challenge-scenario" id="context-summary"></p>
        <div class="objective-card">
          <span>Situation</span>
          <p id="context-situation"></p>
        </div>
      </section>

      <section class="context-board">
        <article>
          <p class="eyebrow">Flag-bearing subtasks</p>
          <h2>Work packages inside this situation</h2>
          <div class="subtask-grid" id="subtask-grid"></div>
        </article>
        <aside>
          <p class="eyebrow">Expansion queue</p>
          <h2>Planned subtasks</h2>
          <ul class="planned-list" id="planned-list"></ul>
        </aside>
      </section>
    </main>

    <script src="/context.js"></script>
  </body>
</html>
